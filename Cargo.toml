[package]
name = "fmtcnv"
version = "2.3.7"
edition = "2024"
authors = ["oriontvv <taranov.vv@gmail.com>", "<github.com/pepa65>"]
description = "Cross-convert bson, csv, hjson, hocon, json, json5, jsonl, plist, ron, toml, toon, xml, yaml"
repository = "https://github.com/pepa65/fmtcnv/"
documentation = "https://docs.rs/fmtcnv"
readme = "README.md"
license = "Apache-2.0"
keywords = ["cli", "format", "convert", "json", "toml"]
categories = ["command-line-utilities"]

[package.metadata.binstall]
pkg-url = "{repo}/releases/download/{version}/{name}"
pkg-fmt = "bin"
disabled-strategies = ["quick-install", "compile"]
target-family = "Linux"
target-arch = "X86_64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{repo}/releases/download/{version}/{name}.exe"

[dependencies]
anyhow = "1.0.102"
bson = { version = "3.1.0", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
csv = "1.4.0"
hocon = { package = "hocon_", version = "0.10", features = ["serde-support"] }
json5 = "1.3.1"
linked-hash-map = "0.5.6"
plist = "1.8.0"
quick-xml = "0.39.2"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
serde-hjson = "1.1.0"
toml = "1.1.2"
toon-format = "0.4.5"

[dev-dependencies]
rstest = "0.26"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
